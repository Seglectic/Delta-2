# delta.conf — source of truth for the delta modifier system
# Edit this file, then run: delta apply
#
# The delta key is Caps Lock (QMK firmware outputs KEY_F20).
# keyd intercepts F20 at evdev level and re-emits Ctrl+Alt+Meta+Key.
# The KWin script catches those combos and tiles the active window.

[device]
# vendor:product ID of the keyboard (find with: sudo keyd list-devices)
keyboard_id = 3434:0151

[bindings]
# ID = KEY  x_start  width        (fractions of screen width, left-to-right)
# ID = KEY  fixed    width height  (fixed pixel size, centered on screen)
# ID = KEY  tile     layout side   (associate window with a KWin tile)
#
# ID is stored by KDE and must stay stable — changing it breaks the shortcut registration.
# KEY is the physical key pressed while holding the delta modifier.
DeltaTileLeft    = A      tile  thirds_right  left
DeltaTileRight   = D      tile  thirds_left   right
DeltaTileLeft3   = Q      tile  thirds_left   left
DeltaTileRight3  = E      tile  thirds_right  right
DeltaHalfLeft    = Left   tile  halves  left
DeltaHalfRight   = Right  tile  halves  right
DeltaFullscreen  = W  0      1
DeltaCenterFixed = S  fixed  1024 768

[overrides]
# Per-app tile overrides. Uncomment and edit as needed.
# KEY is matched against the window's WM_CLASS (resourceClass).
# Find a window's class with: qdbus6 org.kde.KWin /KWin org.kde.KWin.queryWindowInfo
# Format: app_class.KEY = x_start width
#
# example — make terminal windows always fullscreen on Delta+A:
# org.kde.konsole.A = 0 1
