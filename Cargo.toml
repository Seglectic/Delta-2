[workspace]
resolver = "3"
members = ["crates/delta-core", "crates/delta-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Seglectic/Delta-2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
toml = "1"
zbus = "6"
