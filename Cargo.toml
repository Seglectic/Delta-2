[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/delta-core", "crates/delta-cli", "crates/delta-input", "crates/delta-via", "crates/deltad"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Seglectic/Delta-2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "sync"] }
zbus = { version = "6", features = ["tokio"] }
