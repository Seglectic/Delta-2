# Edge-case fixture: every section and action shape the legacy parser understands
[device]
modifier_key = capslock
backend = xremap

[bindings]
DeltaTileLeft    = A      tile  thirds_right  left
DeltaHalfRight   = Right  tile  halves  right
DeltaUp          = Up     0      1
DeltaThird       = Q   0.3333 0.5
DeltaKonsole     = X      app   konsole
DeltaCenterFixed = S  fixed  1024 768

[launchers]
konsole  = /usr/bin/konsole
firefox  = /usr/bin/firefox --new-window

[app_bindings]
discord.F16 = Alt+Up
discord.F17 = Alt+Down
firefox.F13 = Ctrl+Shift+T
discord.F18 = Ctrl+K

[xremap_ignore_devices]
Logitech G502
Some "Quoted" Pad

[aliases]
DeltaKonsole = F19
DeltaTileLeft = F13
DeltaCenterFixed = grave
DeltaThird = F14

[guards]
ignore_fullscreen = false
ignored_desktop_files = steam_app_1, lutris
ignored_classes = wine

[overrides]
org.kde.konsole.Q = 0 1
firefox.Up = 0.25 0.5
