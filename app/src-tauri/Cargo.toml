[package]
name = "delta-app"
description = "Delta's GUI: your keyboard, its firmware layers, and your Delta bindings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "delta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
delta-core = { path = "../../crates/delta-core" }
delta-input = { path = "../../crates/delta-input" }
delta-via = { path = "../../crates/delta-via" }
serde = { workspace = true }
tauri = { version = "2", features = [] }
